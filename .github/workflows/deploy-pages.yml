# Static deployment without a build step; only runtime files enter the Pages artifact.
name: Deploy static PWA to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-static-pwa
  cancel-in-progress: true

jobs:
  check:
    name: Prüfe statische PWA
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prüfe PWA-Eingaben
        env:
          PWA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-static-pwa.mjs

      - name: Führe Prüfregressionen aus
        run: node --test tests/check-static-pwa.test.mjs

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site artifact
        run: |
          mkdir _site
          cp index.html styles.css theme.js app.js manifest.webmanifest sw.js .nojekyll _site/
          cp -R icons _site/icons
          cp -R fonts _site/fonts

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
