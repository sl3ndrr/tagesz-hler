<!DOCTYPE html>
<html lang="de" data-theme="system" data-color="purple">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6750A4" id="theme-color-meta">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Tageszähler & Rechner</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
/* ── Dynamische Farbschemata ── */
:root {
  --hue-primary: 257;
  --hue-sat: 35%;

  --md-sys-color-primary:            hsl(var(--hue-primary), var(--hue-sat), 48%);
  --md-sys-color-on-primary:         #FFFFFF;
  --md-sys-color-primary-container:  hsl(var(--hue-primary), var(--hue-sat), 90%);
  --md-sys-color-on-primary-container: hsl(var(--hue-primary), var(--hue-sat), 20%);
  --md-sys-color-secondary:          #625B71;
  --md-sys-color-secondary-container:#E8DEF8;
  --md-sys-color-surface:            #FEF7FF;
  --md-sys-color-surface-variant:    #E7E0EC;
  --md-sys-color-on-surface:         #1C1B1F;
  --md-sys-color-on-surface-variant: #49454F;
  --md-sys-color-outline:            #79747E;
  --md-sys-color-outline-variant:    #CAC4D0;
  --md-sys-color-background:         #FEF7FF;
  --md-sys-color-error:              #B3261E;

  --flip-bg:    #1C1B1F;
  --flip-text:  #EADDFF;
  --flip-split: hsl(var(--hue-primary), var(--hue-sat), 48%);

  --md-elevation-1: 0 1px 2px rgba(0,0,0,.12), 0 2px 4px rgba(0,0,0,.08);
  --md-elevation-2: 0 1px 2px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.10);
  --md-elevation-3: 0 2px 6px rgba(0,0,0,.16), 0 4px 16px rgba(0,0,0,.12);
  --md-shape-small:  12px;
  --md-shape-medium: 16px;
  --md-shape-large:  28px;
  --md-shape-xl:     36px;
  --font: 'Google Sans', 'Roboto Flex', Roboto, system-ui, sans-serif;
  --ts: 300ms cubic-bezier(0.2, 0, 0, 1);
  --te: 400ms cubic-bezier(0.05, 0.7, 0.1, 1);
}

@media (prefers-color-scheme: dark) {
  html[data-theme="system"] {
    --md-sys-color-primary:            hsl(var(--hue-primary), var(--hue-sat), 80%);
    --md-sys-color-on-primary:         hsl(var(--hue-primary), var(--hue-sat), 20%);
    --md-sys-color-primary-container:  hsl(var(--hue-primary), var(--hue-sat), 30%);
    --md-sys-color-on-primary-container: hsl(var(--hue-primary), var(--hue-sat), 90%);
    --md-sys-color-secondary:          #CCC2DC;
    --md-sys-color-secondary-container:#4A4458;
    --md-sys-color-surface:            #141218;
    --md-sys-color-surface-variant:    #2A2831;
    --md-sys-color-on-surface:         #E6E1E5;
    --md-sys-color-on-surface-variant: #CAC4D0;
    --md-sys-color-outline:            #938F99;
    --md-sys-color-outline-variant:    #49454F;
    --md-sys-color-background:         #141218;
    --md-sys-color-error:              #F2B8B5;
    --flip-bg: #2B2930;
  }
}

html[data-theme="dark"] {
  --md-sys-color-primary:            hsl(var(--hue-primary), var(--hue-sat), 80%);
  --md-sys-color-on-primary:         hsl(var(--hue-primary), var(--hue-sat), 20%);
  --md-sys-color-primary-container:  hsl(var(--hue-primary), var(--hue-sat), 30%);
  --md-sys-color-on-primary-container: hsl(var(--hue-primary), var(--hue-sat), 90%);
  --md-sys-color-secondary:          #CCC2DC;
  --md-sys-color-secondary-container:#4A4458;
  --md-sys-color-surface:            #141218;
  --md-sys-color-surface-variant:    #2A2831;
  --md-sys-color-on-surface:         #E6E1E5;
  --md-sys-color-on-surface-variant: #CAC4D0;
  --md-sys-color-outline:            #938F99;
  --md-sys-color-outline-variant:    #49454F;
  --md-sys-color-background:         #141218;
  --md-sys-color-error:              #F2B8B5;
  --flip-bg: #2B2930;
}

html[data-color="purple"] { --hue-primary: 257; --hue-sat: 35%; }
html[data-color="blue"]   { --hue-primary: 210; --hue-sat: 60%; }
html[data-color="green"]  { --hue-primary: 150; --hue-sat: 50%; }
html[data-color="orange"] { --hue-primary: 25;  --hue-sat: 80%; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: var(--font);
  background: var(--md-sys-color-background);
  color: var(--md-sys-color-on-surface);
  min-height: 100dvh;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  transition: background var(--ts), color var(--ts);
}

.ripple-host { position: relative; overflow: hidden; }
.ripple-wave {
  position: absolute; border-radius: 50%;
  background: currentColor; opacity: 0; pointer-events: none;
  transform: scale(0); animation: ripple 600ms ease-out forwards;
}
@keyframes ripple { 0% { transform:scale(0); opacity:.22; } 100% { transform:scale(4); opacity:0; } }

.app-container { max-width: 1400px; margin: 0 auto; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

.app-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(12px + env(safe-area-inset-top)) 20px 8px; position: sticky; top: 0; z-index: 100;
  background: var(--md-sys-color-background);
}
.app-bar-title { font-size: 1.375rem; font-weight: 600; letter-spacing: -.01em; }

.icon-btn {
  width: 48px; height: 48px; border-radius: 50%; border: none; background: transparent;
  color: var(--md-sys-color-on-surface); display: flex; align-items: center; justify-content: center; cursor: pointer;
  touch-action: manipulation;
}

.tab-bar {
  display: flex; border-bottom: 1px solid var(--md-sys-color-outline-variant);
  padding: 0 20px; position: relative; margin-bottom: 16px;
}
.tab-item {
  flex: 1; text-align: center; padding: 16px 4px; border: 0; background: transparent; font-family: var(--font);
  font-size: .875rem; font-weight: 600; color: var(--md-sys-color-on-surface-variant);
  cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent; transition: color var(--ts);
  touch-action: manipulation;
}
.tab-item.active { color: var(--md-sys-color-primary); }
.tab-indicator {
  position: absolute; bottom: 0; left: 0; height: 3px; border-radius: 3px 3px 0 0;
  background: var(--md-sys-color-primary); transition: transform var(--ts), width var(--ts);
  width: 0; transform: translateX(0);
}

.tab-content { display: none; padding: 0 20px; }
.tab-content.active { display: block; }

.event-list {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px;
}

.stagger-enter {
  animation: slideUp 0.4s cubic-bezier(0.05, 0.7, 0.1, 1) both;
}
@keyframes slideUp {
  0% { opacity: 0; transform: translateY(30px) scale(0.95); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* ── Event Card ── */
.event-card {
  border-radius: var(--md-shape-large); overflow: hidden; cursor: pointer; position: relative;
  min-height: 172px; padding: 20px 16px 16px; display: flex; flex-direction: column; justify-content: flex-end;
  box-shadow: var(--md-elevation-1); background: var(--md-sys-color-surface-variant);
  -webkit-tap-highlight-color: transparent; transition: transform 200ms, box-shadow 200ms;
  touch-action: manipulation;
}
.event-card:active { transform: scale(.98); box-shadow: none; }
.event-card:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--md-sys-color-primary) 65%, white);
  outline-offset: 2px;
}
.event-card.no-image .card-bg {
  background: linear-gradient(145deg,
    hsl(var(--hue-primary), 48%, 30%) 0%,
    hsl(var(--hue-primary), 38%, 17%) 100%) !important;
}
.event-card.no-image .card-scrim { background: linear-gradient(to top, rgba(0,0,0,.35), rgba(0,0,0,.05)); }
html[data-view="compact"] .event-list { grid-template-columns: 1fr; max-width: 820px; margin-inline: auto; }
html[data-view="compact"] .event-card { min-height: 126px; border-radius: var(--md-shape-medium); }
html[data-view="compact"] .card-name { margin-bottom: 8px; }

/* AKTUALISIERT: card-bg */
.card-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover !important;
  background-position: center center !important;
  background-repeat: no-repeat !important;
  transition: transform 400ms;
  pointer-events: none;
}
.event-card:hover .card-bg { transform: scale(1.03); }
.card-scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.85) 0%, rgba(0,0,0,.35) 60%, transparent 100%); pointer-events: none; }
.card-content { position: relative; z-index: 1; display: flex; flex-direction: column; width: 100%; }

.card-name { font-size: 1rem; font-weight: 600; color: rgba(255,255,255,.95); margin-bottom: 12px; line-height: 1.2; }

.card-progress-wrap { width: 100%; height: 4px; background: rgba(255,255,255,.18); border-radius: 2px; margin-bottom: 8px; overflow: hidden; }
.card-progress-bar { height: 100%; border-radius: 2px; background: var(--md-sys-color-primary); transition: width 0.3s linear; min-width: 2px; }

/* ── Flip Clock ── */
.flip-clock { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.flip-col { display: flex; flex-direction: column; align-items: center; }
.flip-digits-row { display: flex; gap: 1px; }
.flip-digit-wrap { position: relative; width: 26px; height: 34px; perspective: 150px; }
.flip-digit-wrap.wide { width: 34px; }
.flip-face {
  position: absolute; inset: 0; border-radius: 4px; background: var(--flip-bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; font-weight: 700; color: var(--flip-text); font-variant-numeric: tabular-nums;
  overflow: hidden; backface-visibility: hidden;
}
.flip-face::after { content: ''; position: absolute; left:0; right:0; top:50%; height:1px; background: var(--flip-split); opacity:.55; }
.flip-face-top    { clip-path: polygon(0 0,100% 0,100% 50%,0 50%); }
.flip-face-bottom { clip-path: polygon(0 50%,100% 50%,100% 100%,0 100%); }
.flip-face-front  { z-index: 2; }
.flip-face-back   { z-index: 1; transform: rotateX(180deg); }

.flip-digit-wrap.flipping .face-top-front { animation: flip-top 340ms ease-in forwards; }
.flip-digit-wrap.flipping .face-bot-back  { animation: flip-bot 340ms ease-out forwards; }
@keyframes flip-top { 0%{transform:rotateX(0deg)} 100%{transform:rotateX(-90deg)} }
@keyframes flip-bot { 0%{transform:rotateX(180deg)} 100%{transform:rotateX(0deg)} }

.flip-label { font-size: .5rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.55); margin-top: 2px; }

/* ── Empty State ── */
.empty-state { display: flex; flex-direction: column; align-items: center; padding: 64px 20px; color: var(--md-sys-color-on-surface-variant); text-align: center; grid-column: 1 / -1; max-width: 440px; margin: 0 auto; }
.empty-icon-circle { width: 68px; height: 68px; border-radius: 50%; background: var(--md-sys-color-secondary-container); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
.empty-icon-circle svg { width: 34px; height: 34px; stroke: var(--md-sys-color-secondary); }
.empty-headline { font-size: 1rem; font-weight: 600; color: var(--md-sys-color-on-surface); margin-bottom: 6px; }
.empty-body { font-size: .875rem; line-height: 1.6; }

/* ── FAB ── */
.fab {
  position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); right: calc(24px + env(safe-area-inset-right)); z-index: 200;
  height: 56px; padding: 0 20px 0 16px;
  border-radius: var(--md-shape-large); border: none;
  background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container);
  font-family: var(--font); font-size: .875rem; font-weight: 700; letter-spacing: .006em;
  display: flex; align-items: center; gap: 10px; cursor: pointer; box-shadow: var(--md-elevation-3);
  transition: transform var(--ts), box-shadow var(--ts);
  touch-action: manipulation;
}
.fab:active { transform: scale(.93); box-shadow: var(--md-elevation-1); }
.fab svg { width: 22px; height: 22px; }

/* ── Modals & Backdrops ── */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.54); z-index: 300; opacity: 0; pointer-events: none; transition: opacity var(--ts); }
.backdrop.open { opacity: 1; pointer-events: all; }

.sheet {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 400;
  max-height: 93dvh; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: var(--md-shape-xl) var(--md-shape-xl) 0 0;
  background: var(--md-sys-color-surface); box-shadow: var(--md-elevation-3);
  transform: translateY(100%); transition: transform var(--te);
}
.sheet.open { transform: translateY(0); }
.sheet-handle { width: 32px; height: 4px; border-radius: 2px; background: var(--md-sys-color-outline-variant); margin: 12px auto 0; }

@media (min-width: 768px) {
  .sheet { max-width: 600px; left: 50%; transform: translateX(-50%) translateY(100%); border-radius: var(--md-shape-xl); }
  .sheet.open { transform: translateX(-50%) translateY(0); }
}

.detail-hero { position: relative; height: 240px; background: var(--md-sys-color-surface-variant); overflow: hidden; }

/* AKTUALISIERT: detail-hero-bg */
.detail-hero-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover !important;
  background-position: center center !important;
  background-repeat: no-repeat !important;
}
.detail-scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.8) 0%, transparent 70%); }
.detail-hero-text { position: absolute; bottom: 0; padding: 20px; }
.detail-hero-title { font-size: 1.375rem; font-weight: 700; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
.detail-close-btn { position: absolute; top: 12px; left: 12px; width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,.4); border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; touch-action: manipulation; }

.detail-progress-wrap { margin: 20px 20px 0; background: var(--md-sys-color-surface-variant); border-radius: var(--md-shape-medium); padding: 14px 16px; }
.detail-progress-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.detail-progress-label { font-size: .75rem; font-weight: 700; color: var(--md-sys-color-on-surface-variant); }
.detail-progress-pct { font-size: 1.1rem; font-weight: 800; color: var(--md-sys-color-primary); }
.detail-progress-track { height: 6px; border-radius: 3px; background: var(--md-sys-color-outline-variant); overflow: hidden; }
.detail-progress-fill { height: 100%; border-radius: 3px; background: var(--md-sys-color-primary); transition: width 0.3s linear; min-width: 3px; }

.detail-flip-clock { padding: 20px 20px 4px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.detail-flip-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.detail-flip-digits-row { display: flex; gap: 2px; }
.detail-flip-digit-wrap { position: relative; width: 44px; height: 58px; perspective: 200px; }
.detail-flip-digit-wrap.wide { width: 56px; }
.detail-flip-face { position: absolute; inset: 0; border-radius: 8px; background: var(--flip-bg); display: flex; align-items: center; justify-content: center; font-size: 1.75rem; font-weight: 700; color: var(--flip-text); font-variant-numeric: tabular-nums; overflow: hidden; backface-visibility: hidden; }
.detail-flip-face.flip-face-top { clip-path: polygon(0 0,100% 0,100% 50%,0 50%); }
.detail-flip-face.flip-face-bottom { clip-path: polygon(0 50%,100% 50%,100% 100%,0 100%); }
.detail-flip-face.flip-face-front { z-index: 2; }
.detail-flip-face.flip-face-back { z-index: 1; transform: rotateX(180deg); }
.detail-flip-label { font-size: .6rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--md-sys-color-on-surface-variant); }

.detail-body { padding: 8px 20px calc(32px + env(safe-area-inset-bottom)); }
.detail-section-label { font-size: .6875rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--md-sys-color-primary); padding: 16px 0 8px; }
.detail-card { background: var(--md-sys-color-surface-variant); border-radius: var(--md-shape-medium); overflow: hidden; }
.detail-row { display: flex; align-items: flex-start; gap: 14px; padding: 14px 16px; border-bottom: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 40%, transparent); }
.detail-row:last-child { border-bottom: none; }
.detail-row-icon { color: var(--md-sys-color-on-surface-variant); margin-top: 1px; }
.detail-row-icon svg { width: 20px; height: 20px; }
.detail-row-body { flex: 1; }
.detail-row-label { font-size: .6875rem; color: var(--md-sys-color-on-surface-variant); margin-bottom: 2px; font-weight: 500; }
.detail-row-value { font-size: .9375rem; line-height: 1.5; }
.detail-actions { display: flex; gap: 10px; margin-top: 20px; }

/* Edit Sheet & Form */
.edit-sheet-inner { padding: 4px 20px calc(40px + env(safe-area-inset-bottom)); }
.edit-headline { font-size: 1.125rem; font-weight: 700; color: var(--md-sys-color-on-surface); padding: 16px 0 20px; }
.m3-field { position: relative; margin-bottom: 18px; }
.m3-field-label { position: absolute; top: 14px; left: 14px; font-size: .875rem; color: var(--md-sys-color-on-surface-variant); pointer-events: none; transition: all 200ms; background: var(--md-sys-color-surface); padding: 0 4px; }
.m3-input { width: 100%; border: 1.5px solid var(--md-sys-color-outline); border-radius: var(--md-shape-small); padding: 20px 14px 8px; font-size: 1rem; font-family: var(--font); color: var(--md-sys-color-on-surface); background: var(--md-sys-color-surface); outline: none; transition: border-color 200ms; }
.m3-input:focus { border-color: var(--md-sys-color-primary); border-width: 2px; }
.m3-input:focus + .m3-field-label, .m3-input:not(:placeholder-shown) + .m3-field-label { top: -8px; font-size: .6875rem; font-weight: 600; color: var(--md-sys-color-primary); }
textarea.m3-input { resize: vertical; min-height: 88px; padding-top: 22px; }

.unit-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.unit-chip { height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid var(--md-sys-color-outline-variant); background: transparent; color: var(--md-sys-color-on-surface-variant); font-family: var(--font); font-size: .8125rem; font-weight: 600; cursor: pointer; transition: all var(--ts); display: flex; align-items: center; gap: 6px; touch-action: manipulation; }
.unit-chip.selected { background: var(--md-sys-color-secondary-container); border-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary-container); }
.chip-check { display: none; width: 16px; height: 16px; }
.unit-chip.selected .chip-check { display: block; }

.m3-btn { flex: 1; height: 44px; border-radius: var(--md-shape-medium); border: 1px solid var(--md-sys-color-outline-variant); background: transparent; color: var(--md-sys-color-on-surface-variant); font-family: var(--font); font-size: .875rem; font-weight: 700; cursor: pointer; transition: background var(--ts); touch-action: manipulation; }
.m3-btn:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface) 6%, transparent); }
.m3-btn.danger { color: var(--md-sys-color-error); border-color: var(--md-sys-color-error); }
.m3-btn.filled { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border-color: transparent; }

.img-input-wrap { display: flex; gap: 8px; align-items: stretch; margin-bottom: 18px; }
.img-url-input { flex: 1; margin-bottom: 0 !important; }
.img-or-divider { display: flex; align-items: center; font-size: .75rem; font-weight: 700; color: var(--md-sys-color-outline); }
.img-file-btn { padding: 0 18px; border-radius: var(--md-shape-small); border: 1.5px solid var(--md-sys-color-outline); background: transparent; color: var(--md-sys-color-primary); font-family: var(--font); font-size: .875rem; font-weight: 700; cursor: pointer; transition: background var(--ts); touch-action: manipulation; }

.img-preview-wrap { margin-bottom: 18px; border-radius: var(--md-shape-medium); overflow: hidden; height: 160px; display: none; }
.img-preview-wrap img { width: 100%; height: 100%; object-fit: cover; }
.img-clear-btn { display: none; font-size: .75rem; color: var(--md-sys-color-error); background: none; border: none; cursor: pointer; font-weight: 600; padding: 0; margin-top: -12px; margin-bottom: 14px; touch-action: manipulation; }
.form-actions { display: flex; gap: 10px; margin-top: 8px; }

/* Menu Popup */
.menu-popup { position: fixed; top: 64px; right: 20px; z-index: 500; background: var(--md-sys-color-surface); border-radius: var(--md-shape-medium); box-shadow: var(--md-elevation-3); min-width: 220px; overflow: hidden; transform-origin: top right; transform: scale(.8); opacity: 0; pointer-events: none; transition: transform var(--te), opacity var(--te); padding-bottom: 8px; }
.menu-popup.open { transform: scale(1); opacity: 1; pointer-events: all; }
.menu-section-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--md-sys-color-primary); padding: 16px 18px 8px; }
.menu-popup-item { width: 100%; border: 0; background: transparent; font-family: var(--font); text-align: left; padding: 12px 18px; font-size: .9rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 12px; color: var(--md-sys-color-on-surface); transition: background var(--ts); touch-action: manipulation; }
.menu-popup-item:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent); }
.menu-popup-item svg { width: 20px; height: 20px; stroke: var(--md-sys-color-on-surface-variant); }
.menu-popup-item.danger { color: var(--md-sys-color-error); border-top: 1px solid var(--md-sys-color-outline-variant); margin-top: 8px; }
.menu-popup-item.danger svg { stroke: var(--md-sys-color-error); }

.theme-options { display: flex; gap: 8px; padding: 0 18px 8px; }
.theme-btn { flex: 1; padding: 8px 0; font-family: var(--font); border: 1px solid var(--md-sys-color-outline-variant); border-radius: 8px; background: transparent; color: var(--md-sys-color-on-surface); font-size: 0.75rem; font-weight: 600; cursor: pointer; touch-action: manipulation; }
.theme-btn.active { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); border-color: var(--md-sys-color-primary); }

.color-options { display: flex; gap: 12px; padding: 0 18px 8px; }
.color-btn { width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform 0.2s; touch-action: manipulation; }
.color-btn:hover { transform: scale(1.1); }
.color-btn.active { border-color: var(--md-sys-color-on-surface); }
.c-purple { background: #6750A4; }
.c-blue { background: #006494; }
.c-green { background: #1B5E20; }
.c-orange { background: #E65100; }

.snackbar { position: fixed; bottom: calc(96px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(16px); background: #323232; color: #fff; padding: 12px 22px; border-radius: 8px; font-size: .875rem; font-weight: 500; opacity: 0; pointer-events: none; white-space: normal; max-width: min(90vw, 520px); text-align: center; z-index: 600; box-shadow: var(--md-elevation-3); transition: opacity .22s, transform .22s; }
.snackbar.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.calc-message { color: var(--md-sys-color-on-surface-variant); font-size: .875rem; text-align: center; padding: 12px; }

/* Rechner Card Customisation */
.calc-container { max-width: 680px; margin: 0 auto; background: var(--md-sys-color-surface-variant); border-radius: var(--md-shape-large); padding: 24px; box-shadow: var(--md-elevation-1); }
.calc-row { display: flex; gap: 16px; flex-wrap: wrap; }
.calc-row > .m3-field { flex: 1; min-width: 200px; }


.view-options { display: flex; gap: 8px; padding: 0 18px 8px; }
.view-btn { flex: 1; padding: 8px 6px; border: 1px solid var(--md-sys-color-outline-variant); border-radius: 8px; background: transparent; color: var(--md-sys-color-on-surface); font-family: var(--font); font-size: .75rem; font-weight: 600; cursor: pointer; }
.view-btn.active { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); border-color: var(--md-sys-color-primary); }
.sheet-handle { touch-action: none; cursor: grab; }
.sheet.dragging { transition: none !important; }
.sheet-handle:active { cursor: grabbing; }

@media (max-width: 480px) {
  .app-bar { padding-left: 14px; padding-right: 14px; }
  .tab-bar { padding-inline: 8px; }
  .tab-item { font-size: .8rem; padding: 14px 2px; }
  .tab-content { padding-inline: 12px; }
  .calc-container { padding: 16px; border-radius: var(--md-shape-medium); }
  .img-input-wrap { flex-wrap: wrap; }
  .img-url-input { flex-basis: 100%; }
  .img-or-divider { width: 100%; justify-content: center; }
  .img-file-btn { min-height: 44px; flex: 1; }
  .detail-flip-clock { gap: 8px; padding-inline: 12px; }
  .detail-flip-digit-wrap { width: 38px; height: 52px; }
  .detail-flip-digit-wrap.wide { width: 48px; }
  .detail-flip-face { font-size: 1.5rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--md-sys-color-outline-variant); border-radius: 2px; }

#file-input, #img-file-input { display: none; }
</style>

<script>
/* ── APP STATE & CONSTANTS ── */
const ALLOWED_UNITS = ['years', 'months', 'weeks', 'days', 'hours', 'minutes', 'seconds'];
const DEFAULT_UNITS = ['years', 'months', 'weeks', 'days', 'seconds'];
let dataLoadWarning = null;
let events = loadEvents();
let activeTab = 0;
let currentDetailId = null;
let currentEditId = null;
let imgData = null;
let cachedEventElements = [];
let deferredInstallPrompt = null;
let modalHistoryActive = false;
let lastFocusedElement = null;
let snackbarTimer = null;

const unitTranslations = {
  years: 'Jahre', months: 'Monate', weeks: 'Wochen',
  days: 'Tage', hours: 'Std', minutes: 'Min', seconds: 'Sek'
};

/* ── DOM ELEMENTS ── */
const tabItems = document.querySelectorAll('.tab-item');
const tabContents = document.querySelectorAll('.tab-content');
const tabIndicator = document.getElementById('tab-indicator');
const backdrop = document.getElementById('backdrop');
const menuPopup = document.getElementById('menu-popup');
const detailSheet = document.getElementById('detail-sheet');
const editSheet = document.getElementById('edit-sheet');
const addBtn = document.getElementById('add-btn');
const installBtn = document.getElementById('install-btn');
const appMenuTitle = document.getElementById('app-menu-title');
const themeColorMeta = document.getElementById('theme-color-meta');

/* ── INITIALIZE ── */
function init() {
  applyPreferences();
  setActiveTab(0, false);
  renderEvents();
  initCalculator();
  initSheetGestures(detailSheet);
  initSheetGestures(editSheet);
  registerServiceWorker();
  setInterval(tick, 1000);

  window.addEventListener('resize', updateTabIndicator);
  window.addEventListener('online', () => showSnackbar('Wieder online.'));
  window.addEventListener('offline', () => showSnackbar('Offline – gespeicherte Daten bleiben verfügbar.'));

  tabItems.forEach((tab, index) => {
    tab.addEventListener('click', () => setActiveTab(index));
  });

  addBtn.addEventListener('click', () => openEditSheet());
  document.getElementById('menu-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    setMenuOpen(!menuPopup.classList.contains('open'));
  });
  document.getElementById('detail-close-btn').addEventListener('click', closeSheets);
  document.getElementById('detail-edit-btn').addEventListener('click', () => openEditSheet(currentDetailId));
  document.getElementById('detail-delete-btn').addEventListener('click', deleteCurrentEvent);
  document.getElementById('edit-cancel-btn').addEventListener('click', closeEditSheet);
  document.getElementById('edit-save-btn').addEventListener('click', saveEvent);

  backdrop.addEventListener('click', () => {
    closeSheets();
    setMenuOpen(false);
  });
  document.addEventListener('click', (e) => {
    if (!menuPopup.contains(e.target) && !e.target.closest('#menu-btn')) setMenuOpen(false);
  });
  document.addEventListener('keydown', handleGlobalKeydown);
  window.addEventListener('popstate', () => {
    if (modalHistoryActive) {
      modalHistoryActive = false;
      currentEditId = null;
      hideSheets(true);
    }
  });

  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', () => setTheme(btn.dataset.themeVal));
  });
  document.querySelectorAll('.color-btn').forEach(btn => {
    btn.addEventListener('click', () => setColor(btn.dataset.colorVal));
  });
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => setView(btn.dataset.viewVal));
  });

  document.querySelectorAll('#unit-wrap .unit-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      chip.classList.toggle('selected');
      chip.setAttribute('aria-pressed', String(chip.classList.contains('selected')));
    });
  });

  document.getElementById('img-file-btn').addEventListener('click', () => document.getElementById('img-file-input').click());
  document.getElementById('img-file-input').addEventListener('change', handleImageUpload);
  document.getElementById('f-img-url').addEventListener('input', (e) => setPreview(e.target.value.trim(), true));
  document.getElementById('img-clear-btn').addEventListener('click', clearImage);

  document.getElementById('clear-btn').addEventListener('click', () => {
    if (!events.length) return showSnackbar('Es sind keine Ereignisse vorhanden.');
    if (confirm('Wirklich alle Ereignisse löschen?')) {
      if (!saveToLocal([])) return;
      events = [];
      renderEvents();
      setMenuOpen(false);
      showSnackbar('Alle Ereignisse gelöscht.');
    }
  });
  document.getElementById('export-btn').addEventListener('click', exportData);
  document.getElementById('import-btn').addEventListener('click', () => document.getElementById('file-input').click());
  document.getElementById('file-input').addEventListener('change', importData);
  installBtn.addEventListener('click', installPwa);

  document.addEventListener('pointerdown', createRipple);

  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    deferredInstallPrompt = event;
    installBtn.hidden = false;

function safeStorageSet(key, value) {

/* ── DATA VALIDATION & STORAGE ── */
function loadEvents() {
  try {
    const raw = localStorage.getItem('events');
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) throw new Error('Kein Array');
    const normalized = ensureUniqueEventIds(parsed.map((item, index) => normalizeEvent(item, index)).filter(Boolean));
    if (normalized.length !== parsed.length) {
      dataLoadWarning = 'Einige ungültige gespeicherte Ereignisse wurden übersprungen.';
      localStorage.setItem('events', JSON.stringify(normalized));
    }
    return normalized;
  } catch (error) {
    console.warn('Gespeicherte Daten konnten nicht geladen werden:', error);
    dataLoadWarning = 'Gespeicherte Daten waren beschädigt und wurden zurückgesetzt.';
    try { localStorage.removeItem('events'); } catch (_) {}
    return [];
  }
}

function ensureUniqueEventIds(list) {
  const seen = new Set();
  return list.map((event, index) => {
    let id = event.id;
    if (seen.has(id)) id = `${id}-${index}-${Math.random().toString(36).slice(2, 6)}`;
    seen.add(id);
    return id === event.id ? event : { ...event, id };
  });
}

function normalizeEvent(raw, index = 0) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
  const name = typeof raw.name === 'string' ? raw.name.trim() : '';
  const date = typeof raw.date === 'string' ? raw.date : '';
  const time = typeof raw.time === 'string' ? raw.time : '';
  const refDate = typeof raw.refDate === 'string' ? raw.refDate : '';
  const desc = typeof raw.desc === 'string' ? raw.desc.trim() : '';
  const id = raw.id != null ? String(raw.id) : `import-${Date.now()}-${index}`;
  const units = Array.isArray(raw.units) ? ALLOWED_UNITS.filter(unit => raw.units.includes(unit)) : [];
  const img = normalizeImageSource(raw.img);

  if (!name || name.length > 200 || !isValidDateInput(date) || !isValidTimeInput(time) || (refDate && !isValidDateInput(refDate)) || units.length === 0) return null;
  if (refDate && localDateTime(refDate, '') >= localDateTime(date, time)) return null;

  return { id, name, date, time, refDate, desc: desc.slice(0, 4000), units, img };
}

function saveToLocal(nextEvents = events) {
  try {
    localStorage.setItem('events', JSON.stringify(nextEvents));
    return true;
  } catch (error) {
    console.error('Speichern fehlgeschlagen:', error);
    showSnackbar('Speicher voll – Änderung wurde nicht übernommen. Nutze kleinere Bilder oder Bild-URLs.');
    return false;
  }
}

function isValidDateInput(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const [year, month, day] = value.split('-').map(Number);
  const d = new Date(year, month - 1, day);
  return d.getFullYear() === year && d.getMonth() === month - 1 && d.getDate() === day;
}

function isValidTimeInput(value) {
  if (value === '') return true;
  const match = /^(\d{2}):(\d{2})$/.exec(value);
  if (!match) return false;
  const hour = Number(match[1]);
  const minute = Number(match[2]);
  return hour >= 0 && hour <= 23 && minute >= 0 && minute <= 59;
}

function normalizeImageSource(value) {
  if (value == null || value === '') return null;
  if (typeof value !== 'string') return null;
  const src = value.trim();
  if (/^data:image\/(?:png|jpe?g|webp|gif);base64,/i.test(src)) return src;
  try {
    const url = new URL(src, location.href);
    const allowed = url.protocol === 'https:' || (location.protocol === 'http:' && url.protocol === 'http:');
    return allowed ? src : null;
  } catch (_) {
    return null;
  }
}

/* ── DATE/TIME HELPERS ── */
function localDateTime(date, time = '') {
  return new Date(`${date}T${time || '00:00'}`).getTime();
}

function localDateInput(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function calculateProgress(targetTime, refTime, nowTime) {
  if (!refTime || nowTime < refTime) return 0;
  const total = targetTime - refTime;
  return total > 0 ? Math.max(0, Math.min(100, ((nowTime - refTime) / total) * 100)) : 100;
}

function daysInMonth(year, monthIndex) {
  return new Date(year, monthIndex + 1, 0).getDate();
}

function addCalendarYears(date, years) {
  const result = new Date(date);
  const month = result.getMonth();
  const day = result.getDate();
  result.setDate(1);
  result.setFullYear(result.getFullYear() + years);
  result.setMonth(month);
  result.setDate(Math.min(day, daysInMonth(result.getFullYear(), month)));
  return result;
}

function addCalendarMonths(date, months) {
  const result = new Date(date);
  const day = result.getDate();
  const totalMonths = result.getFullYear() * 12 + result.getMonth() + months;
  const targetYear = Math.floor(totalMonths / 12);
  const targetMonth = ((totalMonths % 12) + 12) % 12;
  result.setDate(1);
  result.setFullYear(targetYear);
  result.setMonth(targetMonth);
  result.setDate(Math.min(day, daysInMonth(targetYear, targetMonth)));
  return result;
}

function addCalendarDays(date, days) {
  const result = new Date(date);
  result.setDate(result.getDate() + days);
  return result;
}

function calendarDateDiffDays(start, end) {
  const startDay = Date.UTC(start.getFullYear(), start.getMonth(), start.getDate());
  const endDay = Date.UTC(end.getFullYear(), end.getMonth(), end.getDate());
  return Math.max(0, Math.floor((endDay - startDay) / 86400000));
}

function countWholeCalendarUnits(start, end, estimate, adder) {
  let count = Math.max(0, estimate);
  let candidate = adder(start, count);
  while (count > 0 && candidate > end) {
    count--;
    candidate = adder(start, count);
  }
  let next = adder(start, count + 1);
  while (next <= end) {
    count++;
    candidate = next;
    next = adder(start, count + 1);
  }
  return { count, date: candidate };
}

function initCalculator() {
  const startInput = document.getElementById('calc-start');
  const endInput = document.getElementById('calc-end');
  const today = localDateInput();
  startInput.value = today;
  endInput.value = today;
  startInput.addEventListener('change', updateCalculator);
  endInput.addEventListener('change', updateCalculator);

  document.querySelectorAll('.calc-unit-chip').forEach(chip => {
    chip.setAttribute('aria-pressed', String(chip.classList.contains('selected')));
    chip.addEventListener('click', () => {
      chip.classList.toggle('selected');
      chip.setAttribute('aria-pressed', String(chip.classList.contains('selected')));
      updateCalculator();
    });
  });
  document.querySelectorAll('#unit-wrap .unit-chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.classList.contains('selected'))));
  updateCalculator();
}

function updateCalculator() {
  const startVal = document.getElementById('calc-start').value;
  const endVal = document.getElementById('calc-end').value;
  const container = document.getElementById('calc-flip-clock');

  if (!startVal || !endVal) {
    container.innerHTML = '<div class="calc-message">Bitte Start- und Enddatum auswählen.</div>';
    return;
  }

  const units = Array.from(document.querySelectorAll('.calc-unit-chip.selected')).map(c => c.dataset.unit);
  if (units.length === 0) {
    container.innerHTML = '<div class="calc-message">Mindestens eine Zeiteinheit auswählen.</div>';
    return;
  }

  Array.from(container.children).forEach(child => {
    const unit = child.id.replace('calc-flip-clock-', '');
    if (!units.includes(unit)) child.remove();
  });

  renderFlipClock(container, getDiff(localDateTime(endVal), localDateTime(startVal), units), true);
}

function updateTabIndicator() {
  const active = tabItems[activeTab];
  if (!active) return;
  tabIndicator.style.width = active.offsetWidth + 'px';
  tabIndicator.style.transform = `translateX(${active.offsetLeft}px)`;
}

/* ── RENDER & LIVE UPDATES ── */
function renderEvents() {
  const futureList = document.getElementById('future-list');
  const pastList = document.getElementById('past-list');
  futureList.innerHTML = '';
  pastList.innerHTML = '';
  const now = Date.now();

  const prepared = events.map(ev => ({ ...ev, targetTime: localDateTime(ev.date, ev.time) }));
  const futureEvents = prepared.filter(ev => ev.targetTime > now).sort((a, b) => a.targetTime - b.targetTime);
  const pastEvents = prepared.filter(ev => ev.targetTime <= now).sort((a, b) => b.targetTime - a.targetTime);

  cachedEventElements = [];
  [...futureEvents, ...pastEvents].forEach((ev, index) => {
    const isPast = ev.targetTime <= now;
    const listIndex = isPast ? pastEvents.indexOf(ev) : futureEvents.indexOf(ev);
    const refTime = ev.refDate ? localDateTime(ev.refDate) : null;
    const pct = calculateProgress(ev.targetTime, refTime, now);
    const el = document.createElement('div');
    el.className = `event-card stagger-enter${ev.img ? '' : ' no-image'}`;
    el.style.animationDelay = `${Math.min(listIndex, 8) * 0.05}s`;
    el.setAttribute('role', 'button');
    el.tabIndex = 0;
    el.setAttribute('aria-label', `${ev.name}. ${isPast ? 'Vergangenes' : 'Zukünftiges'} Ereignis öffnen.`);

    const bg = document.createElement('div');
    bg.className = 'card-bg';
    if (ev.img) bg.style.backgroundImage = `url(${JSON.stringify(ev.img)})`;
    const scrim = document.createElement('div');
    scrim.className = 'card-scrim';
    const content = document.createElement('div');
    content.className = 'card-content';
    const name = document.createElement('div');
    name.className = 'card-name';
    name.textContent = ev.name;
    const clock = document.createElement('div');
    clock.className = 'flip-clock';
    clock.id = `clock-card-${ev.id}`;

    content.append(name, clock);
    let progressEl = null;
    if (ev.refDate) {
      const wrap = document.createElement('div');
      wrap.className = 'card-progress-wrap';
      wrap.setAttribute('role', 'progressbar');
      wrap.setAttribute('aria-valuemin', '0');
      wrap.setAttribute('aria-valuemax', '100');
      wrap.setAttribute('aria-valuenow', pct.toFixed(1));
      progressEl = document.createElement('div');
      progressEl.className = 'card-progress-bar';
      progressEl.id = `progress-bar-card-${ev.id}`;
      progressEl.style.width = `${pct}%`;
      wrap.appendChild(progressEl);
      content.appendChild(wrap);
    }

    el.append(bg, scrim, content);
    const open = () => openDetailSheet(ev.id);
    el.addEventListener('click', open);
    el.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        open();
      }
    });

    (isPast ? pastList : futureList).appendChild(el);
    cachedEventElements.push({
      id: ev.id,
      targetTime: ev.targetTime,
      refTime,
      isPast,
      units: ev.units,
      clockEl: clock,
      progressEl,
      progressWrapEl: progressEl?.parentElement || null
    });
  });

  if (futureEvents.length === 0) futureList.innerHTML = emptyStateHTML('Keine zukünftigen Ereignisse', 'Erstelle ein neues Ereignis mit dem Plus-Button.');
  if (pastEvents.length === 0) pastList.innerHTML = emptyStateHTML('Keine vergangenen Ereignisse', 'Hier erscheinen Ereignisse automatisch, sobald ihr Zeitpunkt erreicht wurde.');
  tick();
}

function emptyStateHTML(title, body) {
  return `
    <div class="empty-state">
      <div class="empty-icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div class="empty-headline">${title}</div>
      <div class="empty-body">${body}</div>
    </div>`;
}

function tick() {
  const now = Date.now();
  if (cachedEventElements.some(item => item.isPast !== (item.targetTime <= now))) {
    renderEvents();
    return;
  }

  cachedEventElements.forEach(item => {
    const diffObj = getDiff(item.targetTime, now, item.units);
    if (item.clockEl) renderFlipClock(item.clockEl, diffObj, false);

    if (item.progressEl && item.refTime) {
      const pct = calculateProgress(item.targetTime, item.refTime, now);
      item.progressEl.style.width = `${pct}%`;
      if (item.progressWrapEl) item.progressWrapEl.setAttribute('aria-valuenow', pct.toFixed(1));
    }

    if (currentDetailId === item.id) {
      const detailContainer = document.getElementById('detail-flip-clock');
      if (detailContainer) renderFlipClock(detailContainer, diffObj, true);
      if (item.refTime) {
        const pct = calculateProgress(item.targetTime, item.refTime, now);
        document.getElementById('detail-progress-fill').style.width = `${pct}%`;
        document.getElementById('detail-progress-pct').innerText = `${pct.toFixed(1)}%`;
      }
    }
  });
}

/* ── DST-SAFE CALENDAR DIFFERENCE ── */
function getDiff(target, now, unitsList) {
  const res = [];
  let dStart = new Date(Math.min(target, now));
  const dEnd = new Date(Math.max(target, now));

  if (unitsList.includes('years')) {
    const estimate = dEnd.getFullYear() - dStart.getFullYear();
    const part = countWholeCalendarUnits(dStart, dEnd, estimate, addCalendarYears);
    res.push({ unit: 'years', val: part.count });
    dStart = part.date;
  }

  if (unitsList.includes('months')) {
    const estimate = (dEnd.getFullYear() - dStart.getFullYear()) * 12 + dEnd.getMonth() - dStart.getMonth();
    const part = countWholeCalendarUnits(dStart, dEnd, estimate, addCalendarMonths);
    res.push({ unit: 'months', val: part.count });
    dStart = part.date;
  }

  if (unitsList.includes('weeks')) {
    const estimate = Math.floor(calendarDateDiffDays(dStart, dEnd) / 7);
    const part = countWholeCalendarUnits(dStart, dEnd, estimate, (date, weeks) => addCalendarDays(date, weeks * 7));
    res.push({ unit: 'weeks', val: part.count });
    dStart = part.date;
  }

  if (unitsList.includes('days')) {
    const estimate = calendarDateDiffDays(dStart, dEnd);
    const part = countWholeCalendarUnits(dStart, dEnd, estimate, addCalendarDays);
    res.push({ unit: 'days', val: part.count });
    dStart = part.date;
  }

  let diffMs = dEnd.getTime() - dStart.getTime();
  const map = { hours: 3600000, minutes: 60000, seconds: 1000 };
  ['hours', 'minutes', 'seconds'].forEach(unit => {
    if (!unitsList.includes(unit)) return;
    const val = Math.floor(diffMs / map[unit]);
    res.push({ unit, val });
    diffMs -= val * map[unit];
  });

  return res;
}

function renderFlipClock(container, diffObj, isWide) {
  const activeUnits = new Set(diffObj.map(item => item.unit));
  Array.from(container.children).forEach(child => {
    const unit = child.id.slice(container.id.length + 1);
    if (unit && !activeUnits.has(unit)) child.remove();
  });

  diffObj.forEach(item => {
    const idStr = `${container.id}-${item.unit}`;
    let col = document.getElementById(idStr);
    if (!col) {
      col = document.createElement('div');
      col.className = isWide ? 'detail-flip-col' : 'flip-col';
      col.id = idStr;

      const row = document.createElement('div');
      row.className = isWide ? 'detail-flip-digits-row' : 'flip-digits-row';
      col.appendChild(row);

      const label = document.createElement('div');
      label.className = isWide ? 'detail-flip-label' : 'flip-label';
      label.innerText = unitTranslations[item.unit];
      col.appendChild(label);
      container.appendChild(col);
    }

    const row = col.firstElementChild;
    const valStr = String(item.val).padStart(2, '0');
    while (row.children.length < valStr.length) {
      const wrap = document.createElement('div');
      wrap.className = isWide ? 'detail-flip-digit-wrap wide' : 'flip-digit-wrap';
      const faceClass = isWide ? 'detail-flip-face flip-face' : 'flip-face';
      wrap.innerHTML = `
        <div class="${faceClass} flip-face-top flip-face-front face-top-front">0</div>
        <div class="${faceClass} flip-face-bottom flip-face-front face-bot-front">0</div>
        <div class="${faceClass} flip-face-top flip-face-back face-top-back">0</div>
        <div class="${faceClass} flip-face-bottom flip-face-back face-bot-back">0</div>`;
      row.appendChild(wrap);
    }
    while (row.children.length > valStr.length) row.lastElementChild.remove();

    for (let d = 0; d < valStr.length; d++) {
      const digitWrap = row.children[d];
      const newVal = valStr[d];
      const oldVal = digitWrap.dataset.val;
      const topFront = digitWrap.querySelector('.face-top-front');
      const botFront = digitWrap.querySelector('.face-bot-front');
      const topBack = digitWrap.querySelector('.face-top-back');
      const botBack = digitWrap.querySelector('.face-bot-back');

      if (newVal !== oldVal) {
        digitWrap.dataset.val = newVal;
        if (oldVal !== undefined && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          digitWrap.classList.remove('flipping');
          topFront.innerText = oldVal;
          botFront.innerText = oldVal;
          topBack.innerText = newVal;
          botBack.innerText = newVal;
          requestAnimationFrame(() => requestAnimationFrame(() => digitWrap.classList.add('flipping')));
          setTimeout(() => {
            topFront.innerText = newVal;
            botFront.innerText = newVal;
            digitWrap.classList.remove('flipping');
          }, 340);
        } else {
          topFront.innerText = newVal;
          botFront.innerText = newVal;
          topBack.innerText = newVal;
          botBack.innerText = newVal;
        }
      }
    }
  });
}

/* ── MODALS & FORMS ── */
function openDetailSheet(id) {
  const ev = events.find(event => event.id === id);
  if (!ev) return;
  if (!modalHistoryActive) lastFocusedElement = document.activeElement;
  currentDetailId = id;

  document.getElementById('detail-name').innerText = ev.name;
  const heroBg = document.getElementById('detail-hero-bg');
  heroBg.style.backgroundImage = ev.img ? `url(${JSON.stringify(ev.img)})` : 'linear-gradient(145deg, hsl(var(--hue-primary), 48%, 30%), hsl(var(--hue-primary), 38%, 17%))';

  const d = new Date(localDateTime(ev.date, ev.time));
  document.getElementById('detail-date').innerText = d.toLocaleDateString('de-DE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) + (ev.time ? `, ${ev.time} Uhr` : '');

  const descRow = document.getElementById('detail-desc-row');
  descRow.style.display = ev.desc ? 'flex' : 'none';
  document.getElementById('detail-desc').innerText = ev.desc || '';

  const progressWrap = document.getElementById('detail-progress-wrap');
  if (ev.refDate) {
    progressWrap.style.display = 'block';
    const ref = new Date(localDateTime(ev.refDate));

  } else {

  }

  document.getElementById('detail-flip-clock').innerHTML = '';
  showSheet(detailSheet);
  tick();
  requestAnimationFrame(() => document.getElementById('detail-close-btn').focus());
}

function openEditSheet(id = null) {
  const previousFocus = document.activeElement;
  if (!modalHistoryActive) lastFocusedElement = previousFocus;
  hideSheets(false, false);
  currentEditId = id;
  imgData = null;
  clearImage();
  document.getElementById('edit-headline').innerText = id ? 'Ereignis bearbeiten' : 'Neues Ereignis';

  const ev = id ? events.find(event => event.id === id) : null;
  if (id && !ev) return;
  document.getElementById('f-name').value = ev?.name || '';
  document.getElementById('f-date').value = ev?.date || '';
  document.getElementById('f-time').value = ev?.time || '';
  document.getElementById('f-refdate').value = ev?.refDate || '';
  document.getElementById('f-desc').value = ev?.desc || '';

  document.querySelectorAll('#unit-wrap .unit-chip').forEach(chip => {
    const selected = ev ? ev.units.includes(chip.dataset.unit) : DEFAULT_UNITS.includes(chip.dataset.unit);
    chip.classList.toggle('selected', selected);
    chip.setAttribute('aria-pressed', String(selected));
  });

  if (ev?.img) {

    if (ev.img.startsWith('data:image/')) imgData = ev.img;

  setTimeout(() => document.getElementById('f-name').focus(), 120);

function showSheet(sheet) {
  if (!modalHistoryActive) {
    history.pushState({ tageszaehlerModal: true }, '');
    modalHistoryActive = true;
  }
  backdrop.classList.add('open');
  sheet.inert = false;
  sheet.classList.add('open');
  sheet.setAttribute('aria-hidden', 'false');
}

function hideSheets(restoreFocus = true, resetIds = true) {
  backdrop.classList.remove('open');
  [detailSheet, editSheet].forEach(sheet => {
    sheet.classList.remove('open', 'dragging');
    sheet.style.transform = '';
    sheet.style.transition = '';
    sheet.setAttribute('aria-hidden', 'true');
    sheet.inert = true;
  });
  if (resetIds) currentDetailId = null;
  if (restoreFocus && lastFocusedElement instanceof HTMLElement) requestAnimationFrame(() => lastFocusedElement.focus());
}

function closeSheets() {
  hideSheets(true, true);
  currentEditId = null;
  if (modalHistoryActive) {
    modalHistoryActive = false;
    history.back();
  }
}

function closeEditSheet() {
  const editId = currentEditId;
  currentEditId = null;
  if (editId) {
    hideSheets(false, false);
    openDetailSheet(editId);
  } else {
    closeSheets();
  }
}

function saveEvent() {
  const name = document.getElementById('f-name').value.trim();
  const date = document.getElementById('f-date').value;
  const time = document.getElementById('f-time').value;
  const refDate = document.getElementById('f-refdate').value;
  const desc = document.getElementById('f-desc').value.trim();
  const imgUrlInput = document.getElementById('f-img-url').value.trim();
  const units = Array.from(document.querySelectorAll('#unit-wrap .unit-chip.selected')).map(chip => chip.dataset.unit);

  if (!name || !date) return showSnackbar('Bitte Name und Datum ausfüllen.');
  if (!isValidDateInput(date) || !isValidTimeInput(time) || (refDate && !isValidDateInput(refDate))) return showSnackbar('Bitte gültige Datums- und Zeitwerte verwenden.');
  if (units.length === 0) return showSnackbar('Mindestens eine Zeiteinheit auswählen.');
  if (refDate && localDateTime(refDate) >= localDateTime(date, time)) return showSnackbar('Das Referenzdatum muss vor dem Ereignis liegen.');

  let image = imgData;
  if (imgUrlInput) {
    image = normalizeImageSource(imgUrlInput);
    if (!image) return showSnackbar('Bitte eine gültige HTTPS-Bild-URL verwenden.');
  }

  const event = normalizeEvent({
    id: currentEditId || `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
    name, date, time, refDate, desc, units, img: image
  });
  if (!event) return showSnackbar('Ereignis konnte nicht gespeichert werden. Eingaben prüfen.');

  let nextEvents;
  if (currentEditId) {
    const index = events.findIndex(item => item.id === currentEditId);
    if (index < 0) return showSnackbar('Ereignis wurde nicht gefunden.');
    nextEvents = events.slice();
    nextEvents[index] = event;
  } else {
    nextEvents = [...events, event];
  }

  if (!saveToLocal(nextEvents)) return;
  events = nextEvents;
  const wasEdit = Boolean(currentEditId);
  currentEditId = null;
  renderEvents();
  closeSheets();
  showSnackbar(wasEdit ? 'Geändert.' : 'Erstellt.');
}

function deleteCurrentEvent() {
  if (!currentDetailId || !confirm('Dieses Ereignis löschen?')) return;
  const nextEvents = events.filter(event => event.id !== currentDetailId);
  if (!saveToLocal(nextEvents)) return;
  events = nextEvents;
  renderEvents();
  closeSheets();
  showSnackbar('Gelöscht.');
}

/* ── SHEET GESTURES / ACCESSIBILITY ── */
function initSheetGestures(sheet) {
  const handle = sheet.querySelector('.sheet-handle');
  if (!handle) return;
  let startY = 0;
  let deltaY = 0;
  let pointerId = null;

  handle.addEventListener('pointerdown', event => {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    pointerId = event.pointerId;
    startY = event.clientY;
    deltaY = 0;
    handle.setPointerCapture(pointerId);
    sheet.classList.add('dragging');
  });
  handle.addEventListener('pointermove', event => {
    if (pointerId !== event.pointerId) return;
    deltaY = Math.max(0, event.clientY - startY);
    const desktop = window.matchMedia('(min-width: 768px)').matches;
    sheet.style.transform = desktop ? `translateX(-50%) translateY(${deltaY}px)` : `translateY(${deltaY}px)`;
  });
  const finish = event => {
    if (pointerId !== event.pointerId) return;
    try { handle.releasePointerCapture(pointerId); } catch (_) {}
    pointerId = null;
    sheet.classList.remove('dragging');
    if (deltaY > 90) {
      closeSheets();
    } else {
      sheet.style.transform = '';
    }
  };
  handle.addEventListener('pointerup', finish);
  handle.addEventListener('pointercancel', finish);
}

function handleGlobalKeydown(event) {
  if (event.key === 'Escape') {
    if (menuPopup.classList.contains('open')) {
      setMenuOpen(false);
      document.getElementById('menu-btn').focus();
    } else if (detailSheet.classList.contains('open') || editSheet.classList.contains('open')) {
      closeSheets();
    }
    return;
  }
  if (event.key === 'Tab') trapFocus(event);
  if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
    if (document.activeElement?.classList.contains('tab-item')) {
      event.preventDefault();
      const delta = event.key === 'ArrowRight' ? 1 : -1;
      const next = (activeTab + delta + tabItems.length) % tabItems.length;
      setActiveTab(next);
      tabItems[next].focus();
    }
  }
}

function trapFocus(event) {
  const openSheet = editSheet.classList.contains('open') ? editSheet : detailSheet.classList.contains('open') ? detailSheet : null;
  if (!openSheet) return;
  const focusables = Array.from(openSheet.querySelectorAll('button:not([hidden]), input:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')).filter(el => el.offsetParent !== null);
  if (!focusables.length) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
}

/* ── IMAGE HANDLING ── */
function compressImage(file, callback) {
  if (!file.type.startsWith('image/')) return showSnackbar('Bitte eine Bilddatei auswählen.');
  if (file.size > 20 * 1024 * 1024) return showSnackbar('Das Bild ist zu groß. Bitte maximal 20 MB verwenden.');

  const reader = new FileReader();
  reader.onerror = () => showSnackbar('Bild konnte nicht gelesen werden.');
  reader.onload = event => {
    const img = new Image();
    img.onerror = () => showSnackbar('Bildformat konnte nicht verarbeitet werden.');
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxDimension = 1000;
      const scale = Math.min(1, maxDimension / Math.max(img.width, img.height));
      const width = Math.max(1, Math.round(img.width * scale));
      const height = Math.max(1, Math.round(img.height * scale));
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
}

function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  compressImage(file, compressedDataUrl => {
    imgData = compressedDataUrl;
    document.getElementById('f-img-url').value = '';
    setPreview(imgData);
  });
}

function setPreview(src, allowUnvalidatedUrl = false) {
  const wrap = document.getElementById('img-preview-wrap');
  const img = document.getElementById('img-preview');
  const clear = document.getElementById('img-clear-btn');
  if (!src) return clearImage();
  if (!allowUnvalidatedUrl && !normalizeImageSource(src)) return clearImage();

  img.onload = () => {
    wrap.style.display = 'block';
    clear.style.display = 'block';
  };
  img.onerror = () => {
    wrap.style.display = 'none';
    if (allowUnvalidatedUrl) clear.style.display = 'block';
  };
  img.src = src;
}

function clearImage() {
  imgData = null;
  document.getElementById('f-img-url').value = '';
  document.getElementById('img-file-input').value = '';
  const preview = document.getElementById('img-preview');
  preview.removeAttribute('src');
  document.getElementById('img-preview-wrap').style.display = 'none';
  document.getElementById('img-clear-btn').style.display = 'none';
}

/* ── IMPORT / EXPORT ── */
function exportData() {
  const data = JSON.stringify(events, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = `tageszaehler_export_${localDateInput()}.json`;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  URL.revokeObjectURL(url);
  setMenuOpen(false);
  showSnackbar(`${events.length} Ereignis${events.length === 1 ? '' : 'se'} exportiert.`);
}

function importData(event) {
  const input = event.target;
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = readEvent => {
    try {
      const data = JSON.parse(readEvent.target.result);
      if (!Array.isArray(data)) throw new Error('Die Datei enthält kein Ereignis-Array.');
      const parsedEvents = data.map((item, index) => normalizeEvent(item, index));
      const invalidCount = parsedEvents.filter(item => !item).length;
      if (invalidCount) throw new Error(`${invalidCount} ungültige Ereignisse gefunden.`);
      const normalized = ensureUniqueEventIds(parsedEvents);
      if (!confirm(`${normalized.length} Ereignis${normalized.length === 1 ? '' : 'se'} importieren und aktuelle Daten ersetzen?`)) return;
      if (!saveToLocal(normalized)) return;
      events = normalized;
      renderEvents();
      showSnackbar(`${normalized.length} Ereignis${normalized.length === 1 ? '' : 'se'} importiert.`);
    } catch (error) {
      console.error('Import fehlgeschlagen:', error);
      showSnackbar(`Import fehlgeschlagen: ${error.message || 'ungültige Datei'}`);
    } finally {
      input.value = '';
    }
  };
  reader.onerror = () => showSnackbar('Datei konnte nicht gelesen werden.');
  reader.readAsText(file);
  setMenuOpen(false);
}

/* ── PWA ── */
async function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  try {
    const registration = await navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' });
    registration.update().catch(() => {});
  } catch (error) {
    console.warn('Service Worker konnte nicht registriert werden:', error);
  }
}

async function installPwa() {
  setMenuOpen(false);
  if (!deferredInstallPrompt) {
    return showSnackbar('Installation ist über das Browser-Menü verfügbar.');
  }
  deferredInstallPrompt.prompt();
  const choice = await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installBtn.hidden = true;
  appMenuTitle.hidden = true;
  if (choice.outcome !== 'accepted') showSnackbar('Installation abgebrochen.');
}

/* ── UTILS ── */
function createRipple(event) {
  const target = event.target.closest('.ripple-host');
  if (!target) return;
  const rect = target.getBoundingClientRect();
  const ripple = document.createElement('span');
  const diameter = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = `${diameter}px`;
  ripple.style.left = `${event.clientX - rect.left - diameter / 2}px`;
  ripple.style.top = `${event.clientY - rect.top - diameter / 2}px`;
  ripple.classList.add('ripple-wave');
  target.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
}

function showSnackbar(message) {
  const snackbar = document.getElementById('snackbar');
  clearTimeout(snackbarTimer);
  snackbar.innerText = message;
  snackbar.classList.add('show');
  snackbarTimer = setTimeout(() => snackbar.classList.remove('show'), 3500);
}

init();
</script>
